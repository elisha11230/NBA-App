<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NBA Rosters</title>
<meta name="description" content="Every NBA roster with the starting five on the floor, player numbers, and team stats with league ranks.">
<meta name="theme-color" content="#0E1417">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NBA Rosters">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Same token system as the NFL app. Text tokens clear WCAG AA on page and panel. */
:root{
  --ink:#131C20; --panel:#1B252B; --line:#566C77; --rule:#2F414E;
  --chalk:#EAF1ED; --mute:#A2B3AD; --dim:#819590; --strong:#FFFFFF;
  --brass:#D9B84A;
  --court:#2A2219; --courtline:rgba(234,241,237,.34); --rimline:rgba(234,241,237,.7); --plank:rgba(255,255,255,.035);
  --team:#4A7C6F; --team2:#0E1417; --team-accent:#7FA99E;
  --rise:#6FD69B; --fall:#E08A8A; --good:#5FBF8A; --bad:#C98080;
  --bg0:#0A0F11; --bg1:#0E1518; --bg2:#161F24; --face:#0B1113; --chip:#1f2a30; --hover:#243039; --shotbg:#211B15;
  --nameshadow:0 1px 4px rgba(0,0,0,.9); --popshadow:0 14px 30px rgba(0,0,0,.5);
  --r:3px; color-scheme:dark;
}
/* Light theme: same layout, daylight palette, maple court. Text tokens keep WCAG AA on the page and panels. */
:root[data-theme="light"]{
  --ink:#F3F0E9; --panel:#FFFFFF; --line:#C3CBC8; --rule:#E2E6E3;
  --chalk:#1C2528; --mute:#4C585C; --dim:#5F6B6E; --strong:#0E1417;
  --brass:#8A6A0A;
  --court:#E6CFA0; --courtline:rgba(70,45,20,.42); --rimline:rgba(70,45,20,.75); --plank:rgba(90,60,20,.07);
  --rise:#1D8049; --fall:#B23A3A; --good:#1D7F48; --bad:#B03A3A;
  --bg0:#E7E2D8; --bg1:#EEEAE2; --bg2:#F7F5F0; --face:#D8DDDB; --chip:#F1F3F1; --hover:#E4E9E6; --shotbg:#F2E6CC;
  --nameshadow:0 1px 3px rgba(255,248,235,.95),0 0 8px rgba(255,248,235,.8); --popshadow:0 14px 30px rgba(40,40,30,.18);
  color-scheme:light;
}
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
*::-webkit-scrollbar{width:6px;height:6px}
*::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ink);color:var(--chalk);font:400 15px/1.5 Barlow,-apple-system,system-ui,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow:hidden}
.blk{font-family:'Archivo Black',Impact,sans-serif;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--team-accent);outline-offset:2px}
#app{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top,0px)}

/* ---------- team rail, grouped by division ---------- */
#rail{display:flex;overflow-x:auto;overflow-y:hidden;background:var(--bg0);border-bottom:1px solid var(--line);flex:0 0 auto}
#rail::-webkit-scrollbar{height:3px}
.dgroup{flex:0 0 auto;display:flex;flex-direction:column;gap:5px;padding:8px 13px 9px;border-right:1px solid var(--line)}
.dgroup:last-child{border-right:0}
.dlabel{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:10.5px;text-transform:uppercase;
  letter-spacing:.16em;color:var(--dim);padding-left:2px;white-space:nowrap}
.dteams{display:flex;gap:3px}
.tbtn{position:relative;width:38px;height:38px;padding:4px;border-radius:var(--r);display:flex;align-items:center;
  justify-content:center;opacity:.5;transition:opacity .15s,background .15s}
.tbtn:hover{opacity:.9;background:var(--bg2)}
.tbtn[aria-current="true"]{opacity:1;background:var(--bg2)}
.tbtn[aria-current="true"]::after{content:"";position:absolute;left:6px;right:6px;bottom:-1px;height:2px;background:var(--team-accent);border-radius:1px}
.tbtn img{width:100%;height:100%;object-fit:contain;display:block}


/* ---------- search ---------- */
#searchbar{position:relative;flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:7px 16px;
  border-bottom:1px solid var(--line);background:var(--bg1)}
#searchbar .mag{color:var(--dim);font-size:15px}
#q{flex:1 1 auto;background:none;border:0;color:var(--chalk);font:500 14px Barlow,sans-serif;outline:none;min-width:0}
#q::placeholder{color:var(--dim)}
#results{position:absolute;left:10px;right:10px;top:100%;z-index:30;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);max-height:340px;overflow:auto;box-shadow:var(--popshadow)}
.res{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 11px;border-bottom:1px solid var(--rule)}
.res:last-child{border-bottom:0}
.res:hover,.res.on{background:var(--rule)}
.res img{width:30px;height:30px;border-radius:50%;object-fit:cover;object-position:top;background:var(--face)}
.res .rn{flex:1 1 auto;font-size:14px}
.res .rt{font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase}

/* ---------- team header ---------- */
#head{flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:16px 20px 13px;
  border-bottom:1px solid var(--line);position:relative;flex-wrap:wrap;
  background:linear-gradient(180deg,color-mix(in srgb,var(--team) 14%,transparent),transparent)}
#head::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--team)}
#hl{min-width:0;display:flex;gap:14px;align-items:center}
#hlogo{width:52px;height:52px;object-fit:contain;flex:0 0 auto}
#tname{font-size:clamp(20px,3.4vw,30px);line-height:1;color:var(--strong)}
#trec{display:flex;align-items:center;gap:9px;margin-top:7px;flex-wrap:wrap}
#trec .wl{font-family:'Archivo Black',sans-serif;font-size:15px;color:var(--strong)}
.tagpill{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.1em;font-size:11.5px;
  color:var(--mute);padding:3px 8px;border:1px solid var(--line);border-radius:var(--r);white-space:nowrap}
.tagpill.gold{border-color:var(--brass);color:var(--brass)}
.tagpill.live{border-color:#D06A6A;color:#F2B0B0}
#hr{display:flex;gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden;flex:0 0 auto}
#hr button{padding:8px 15px;background:var(--panel);font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:13px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
#hr button[aria-pressed="true"]{background:var(--team);color:var(--team2)}

/* ---------- body split ---------- */
#split{flex:1 1 auto;display:flex;min-height:0}
#floorwrap{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;padding:16px 18px 12px;overflow:auto}
#floorbar{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;gap:12px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--dim);font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.11em}

/* ---------- the floor ---------- */
#floor{position:relative;width:min(100%,max(560px,calc((100vh - 300px)*1.613)));margin:0 auto;aspect-ratio:1000/620;
  background:var(--court);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;flex:0 0 auto}
#floor svg{position:absolute;inset:0;width:100%;height:100%}
#chips{position:absolute;inset:0}

.chip{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:84px}
.disc{position:relative;width:78px;height:78px;transition:transform .13s}
.face{width:100%;height:100%;border-radius:50%;overflow:hidden;background:var(--face);border:3px solid var(--team);
  transition:box-shadow .13s,border-color .13s}
.chip:hover .disc,.chip.sel .disc{transform:scale(1.07)}
.chip:hover .face,.chip.sel .face{box-shadow:0 0 0 4px color-mix(in srgb,var(--team) 38%,transparent)}
.chip.sel .face{border-color:var(--strong)}
.face img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-family:'Archivo Black',sans-serif;font-size:20px;color:var(--dim)}
.jersey{position:absolute;right:-6px;bottom:-2px;min-width:27px;height:27px;padding:0 6px;border-radius:14px;
  background:var(--team);color:var(--team2);font-family:'Archivo Black',sans-serif;font-size:13px;line-height:1;
  display:flex;align-items:center;justify-content:center;border:2px solid var(--court)}
.slot{position:absolute;left:-10px;top:-4px;height:22px;padding:0 6px;border-radius:2px;background:var(--bg0);
  border:1px solid var(--line);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;
  letter-spacing:.08em;color:var(--chalk);display:flex;align-items:center}
.pname{position:absolute;top:calc(100% + 4px);left:50%;transform:translateX(-50%);width:160px;pointer-events:none;
  font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;color:var(--strong);text-align:center;line-height:1.1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:var(--nameshadow)}
.pline{position:absolute;top:calc(100% + 22px);left:50%;transform:translateX(-50%);white-space:nowrap;pointer-events:none;
  font-family:'Barlow Condensed',sans-serif;font-size:12.5px;letter-spacing:.06em;color:var(--mute);text-shadow:var(--nameshadow)}
.pline b{color:var(--chalk);font-weight:700}

/* ---------- bench ---------- */
#benchhead{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 8px;gap:10px}
#benchhead h2{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;text-transform:uppercase;
  letter-spacing:.14em;color:var(--chalk)}
#bench{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:6px}
.bn{display:flex;align-items:center;gap:10px;padding:7px 9px;border:1px solid var(--rule);border-radius:var(--r);
  background:var(--panel);text-align:left;transition:border-color .13s,background .13s;min-width:0}
.bn:hover{border-color:var(--line)}
.bn.sel{border-color:var(--team-accent);background:color-mix(in srgb,var(--team) 16%,var(--panel))}
.bn .bf{position:relative;flex:0 0 40px;height:40px;border-radius:50%;overflow:hidden;background:var(--face);border:2px solid var(--rule)}
.bn .bf img{width:100%;height:100%;object-fit:cover;object-position:top}
.bn .bf .fallback{font-size:12px}
.bn .bi{min-width:0;flex:1 1 auto}
.bn .bnm{font-size:13.5px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bn .bmt{font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.06em;color:var(--dim)}
.bn .bmt b{color:var(--mute);font-weight:600}
.newtag{font-family:'Barlow Condensed',sans-serif;font-size:10.5px;letter-spacing:.08em;font-weight:700;padding:0 4px;
  border-radius:2px;border:1px solid color-mix(in srgb,var(--team-accent) 60%,var(--line));color:var(--team-accent);margin-left:4px}

/* ---------- detail panel ---------- */
#detail{flex:0 0 380px;border-left:1px solid var(--line);background:var(--bg2);overflow-y:auto;padding:18px 18px 30px}
#back{display:flex;align-items:center;gap:7px;margin-bottom:14px;font-family:'Barlow Condensed',sans-serif;
  text-transform:uppercase;letter-spacing:.11em;font-size:12px;color:var(--mute)}
#back:hover{color:var(--chalk)}
.dhead{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}
.dphoto{flex:0 0 92px;height:92px;border-radius:var(--r);overflow:hidden;background:var(--face);border:1px solid var(--line)}
.dphoto img{width:100%;height:100%;object-fit:cover;object-position:top center}
.dnum{font-family:'Archivo Black',sans-serif;font-size:13px;color:var(--team-accent);margin-bottom:2px}
.dname{font-size:22px;line-height:1.08;color:var(--strong);margin-bottom:6px}
.dpos{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.1em;font-size:12.5px;color:var(--mute)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line);border-radius:var(--r);
  font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.1em;font-size:11.5px;font-weight:600;color:var(--mute);white-space:nowrap}
.pill b{font-family:'Archivo Black',sans-serif;font-size:12px;letter-spacing:0;color:var(--chalk)}
.pill.team{border-color:color-mix(in srgb,var(--team-accent) 60%,var(--line));color:var(--team-accent)}

.sect{margin-top:14px;padding:14px 15px 15px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);position:relative;overflow:hidden}
.sect::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--team-accent);opacity:.75}
.sect.k-stat::before{background:var(--rise)}
.sect.k-time::before{background:#6E9FD8}
.sect.k-rating::before{background:#E0A15B}
.sect.k-people::before{background:#A98BD0}
.sect.k-health::before{background:#D06A6A}
.sect h3{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.13em;
  color:var(--chalk);padding-bottom:9px;border-bottom:1px solid var(--rule);margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sect h3 span{color:var(--dim);letter-spacing:.07em;font-weight:600;font-size:11px;white-space:nowrap}
.note{font-size:12.5px;color:var(--dim);line-height:1.5;margin-top:8px}

/* big three */
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);border-radius:var(--r);overflow:hidden;margin-bottom:6px}
.big3 div{background:var(--panel);padding:9px 6px 8px;text-align:center}
.big3 b{display:block;font-family:'Archivo Black',sans-serif;font-size:24px;line-height:1.05;color:var(--strong)}
.big3 span{font-family:'Barlow Condensed',sans-serif;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.big3 i{display:block;font-style:normal;font-family:'Barlow Condensed',sans-serif;font-size:11.5px;letter-spacing:.05em;margin-top:1px}

.stat{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--rule)}
.stat:last-child{border-bottom:0}
.stat .l{flex:1 1 auto;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.07em;font-size:13px;color:var(--mute)}
.stat .l small{display:block;text-transform:none;letter-spacing:0;font-family:Barlow,sans-serif;font-size:11.5px;color:var(--dim);line-height:1.3}
.stat .v{font-family:'Archivo Black',sans-serif;font-size:14px;color:var(--strong);min-width:54px;text-align:right}
.stat .r{flex:0 0 58px;text-align:right;font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.04em;color:var(--dim)}
.good{color:var(--good)!important} .low{color:var(--bad)!important} .mid{color:var(--dim)}
.bar{flex:0 0 60px;height:6px;background:var(--rule);border-radius:3px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--team-accent);border-radius:3px}

/* four factors grid */
.ff{display:grid;grid-template-columns:1fr auto auto;gap:0 12px;font-size:13px}
.ff div{padding:7px 0;border-bottom:1px solid var(--rule)}
.ff .h{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding-top:0}
.ff .l{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.07em;font-size:13px;color:var(--mute)}
.ff .v{text-align:right;font-family:'Archivo Black',sans-serif;font-size:13px;color:var(--strong);white-space:nowrap}
.ff .v span{font-family:'Barlow Condensed',sans-serif;font-size:11.5px;margin-left:5px;letter-spacing:.03em}

.recgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);border-radius:var(--r);overflow:hidden}
.recgrid div{background:var(--panel);padding:8px 8px 7px}
.recgrid b{display:block;font-family:'Archivo Black',sans-serif;font-size:15px;color:var(--strong)}
.recgrid span{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim)}

.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;margin-top:6px;font-family:'Barlow Condensed',sans-serif;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

table.tb{width:100%;border-collapse:collapse;font-size:12.5px}
.tb th{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);
  text-align:right;padding:0 4px 6px;border-bottom:1px solid var(--rule);white-space:nowrap}
.tb th:first-child,.tb td:first-child{text-align:left;padding-left:0}
.tb td{text-align:right;padding:6px 4px;border-bottom:1px solid var(--rule);white-space:nowrap}
.tb tr:last-child td{border-bottom:0}
.tb td.w{color:var(--good)} .tb td.lz{color:var(--bad)}
.tb td b{font-family:'Archivo Black',sans-serif;font-weight:400;font-size:12.5px;color:var(--strong)}
.tb tr.po td{background:color-mix(in srgb,var(--brass) 7%,transparent)}
.scroll{overflow-x:auto;margin:0 -2px}
.more{margin-top:10px;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.11em;font-size:12px;color:var(--mute);
  border:1px solid var(--line);border-radius:var(--r);padding:6px 10px;width:100%}
.more:hover{color:var(--chalk)}
.plist{display:flex;flex-direction:column}
.prow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 4px;border-bottom:1px solid var(--rule);border-radius:0}
.prow:last-child{border-bottom:0}
.prow:hover{background:var(--rule)}
.prow .pn{flex:1 1 auto;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .pv{font-family:'Archivo Black',sans-serif;font-size:13px;color:var(--strong)}
.prow .pd{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:var(--dim);letter-spacing:.05em;min-width:66px;text-align:right}


/* ---------- shot charts ---------- */
.seg{display:flex;gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:10px}
.seg button{flex:1 1 0;padding:6px 8px;background:var(--panel);font-family:'Barlow Condensed',sans-serif;font-weight:600;
  font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--team);color:var(--team2)}
.shotwrap{background:var(--shotbg);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.shotwrap svg{display:block;width:100%;height:auto}
.heat{display:flex;align-items:center;gap:8px;margin-top:8px;font-family:'Barlow Condensed',sans-serif;font-size:11.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.hkey{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.hkey span{flex:1 1 0;min-width:56px;font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.05em;color:var(--mute);text-align:center}
.hkey i{display:block;height:8px;border-radius:2px;margin-bottom:3px}
.heat .ramp{flex:1 1 auto;height:7px;border-radius:4px;background:linear-gradient(90deg,#4F86CC,#8E9A96,#E8844A)}
.zt td:nth-child(n+2),.zt th:nth-child(n+2){text-align:right}
.zt .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* ---------- 2K ratings ---------- */
.k2{position:absolute;right:-8px;top:-5px;min-width:26px;height:26px;padding:0 4px;border-radius:13px;background:var(--brass);
  color:#181200;border:2px solid var(--court);font-family:'Archivo Black',sans-serif;font-size:11.5px;line-height:1;
  display:flex;align-items:center;justify-content:center}
.bk2{font-family:'Archivo Black',sans-serif;font-size:12px;color:var(--brass);margin-left:auto;padding-left:6px}
.sect.k-2k::before{background:#E0A15B}
.sect.k-money::before{background:var(--brass)}
.k2head{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.k2ovr{flex:0 0 64px;height:64px;border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;

.ocini{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:'Archivo Black',sans-serif;font-size:13px;color:var(--dim)}
.ocj{position:absolute;right:-7px;bottom:-3px;min-width:19px;height:19px;padding:0 4px;border-radius:10px;background:var(--tc);color:var(--tc2);
  font-family:'Archivo Black',sans-serif;font-size:10px;line-height:1;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--court);box-sizing:border-box}
.ocfl{position:absolute;left:-10px;top:-3px;font-style:normal;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:10px;padding:1px 3px;border-radius:2px;background:var(--brass);color:#0E1417}
.ocfl.hot{background:#C0392B;color:#fff}
.ocn{margin-top:2px;max-width:100%;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:12.5px;line-height:1.1;color:var(--strong);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:var(--nameshadow)}
.ocn b{font-family:'Archivo Black',sans-serif;font-weight:400;font-size:11px;color:var(--brass)}
.ocp.fresh .ocf{box-shadow:0 0 0 3px color-mix(in srgb,var(--brass) 70%,transparent)}
.ocin{position:absolute;top:-9px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  padding:0 4px;border-radius:2px;background:var(--brass);color:#0E1417}
a.ocp:hover .ocf{box-shadow:0 0 0 3px color-mix(in srgb,var(--tc) 45%,transparent)}
.ocnote{margin-top:5px}
@media (max-width:640px){.ocp{width:60px;margin-left:-30px;margin-top:-16px}.ocd{width:32px;height:32px}.ocn{font-size:10.5px}.ocn b{font-size:9.5px}
  .ocj{min-width:15px;height:15px;font-size:8.5px;right:-6px;bottom:-3px}.ocini{font-size:10px}.octm{font-size:9.5px;top:3px}.octm img{width:12px;height:12px}.ocin{top:-8px;font-size:8.5px}}
/* ---------- live on the floor ---------- */
.pline.live{color:#F2B0B0}
.pline.live b{color:var(--strong)}
.livedot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#E0402A;margin-right:4px;vertical-align:1px;animation:pulse 1.4s infinite}
.cmpbtn{margin-top:8px}
/* ---------- time slider ---------- */
#timebar{display:flex;align-items:center;gap:12px;margin:0 0 10px;padding:9px 12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
#timebar.past{border-color:var(--brass);background:color-mix(in srgb,var(--brass) 8%,var(--panel))}
#timelab{font-family:'Archivo Black',sans-serif;font-size:14px;color:var(--strong);min-width:118px;white-space:nowrap}
#timelab small{display:block;font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:400}
#time{flex:1 1 auto;accent-color:var(--brass);min-width:0}
#timenow{flex:0 0 auto}
#timenow[hidden]{display:none}
.tticks{display:flex;justify-content:space-between;font-family:'Barlow Condensed',sans-serif;font-size:10.5px;color:var(--dim);margin:-6px 12px 8px 142px}
@media (max-width:640px){#timebar{flex-wrap:wrap}#timelab{min-width:0;flex:1 1 auto}#time{flex:1 1 100%;order:3}.tticks{margin-left:12px}}
.histhead{font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass)}
/* ---------- expansion: honors, bio, college, advanced, news, moves, draft board, game info ---------- */
.honors{display:flex;flex-wrap:wrap;gap:5px}
.honor{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:var(--r);border:1px solid var(--line);font-size:12.5px;color:var(--chalk);background:var(--chip)}
.honor b{font-family:'Archivo Black',sans-serif;font-size:11.5px;color:var(--brass)}
.honor.top{border-color:var(--brass);background:color-mix(in srgb,var(--brass) 12%,var(--chip))}
.biogrid{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.biogrid span{font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding-top:1px}
.news{display:flex;flex-direction:column}
.nrow{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule);text-decoration:none;color:inherit}
.nrow:last-child{border-bottom:0}
.nrow img{width:74px;height:46px;object-fit:cover;border-radius:2px;background:var(--face);flex:0 0 auto}
.nrow .nt{font-size:13.5px;line-height:1.3;color:var(--chalk)}
.nrow .nd{font-family:'Barlow Condensed',sans-serif;font-size:11.5px;color:var(--dim);letter-spacing:.05em;margin-top:2px}
.mv{padding:7px 0;border-bottom:1px solid var(--rule);font-size:13px;line-height:1.35}
.mv:last-child{border-bottom:0}
.mv span{display:block;font-family:'Barlow Condensed',sans-serif;font-size:11.5px;color:var(--dim);letter-spacing:.05em}
.prow2{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--rule)}
.prow2 .rk{font-family:'Archivo Black',sans-serif;font-size:13px;color:var(--dim);text-align:right}
.prow2 .pn{font-size:14px;color:var(--chalk)}
.prow2 .pn small{display:block;font-family:'Barlow Condensed',sans-serif;font-size:12px;color:var(--dim);letter-spacing:.05em}
.prow2 img{width:24px;height:24px;object-fit:contain}
.ginfo .stat .l{text-transform:none;letter-spacing:0;font-family:Barlow,sans-serif;font-size:13.5px;color:var(--chalk)}
.hl{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.hl a{display:block;text-decoration:none;color:var(--chalk);font-size:12.5px;line-height:1.3}
.hl img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:var(--r);background:var(--face);display:block;margin-bottom:4px}
video.hlv{width:100%;border-radius:var(--r);background:#000;display:block;margin-bottom:8px}
.probbar{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:6px 0}
.probbar i{display:block;height:100%}
.edrow{display:flex;align-items:flex-end;gap:3px;height:56px;margin-top:6px}
.edrow div{flex:1 1 0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.edrow i{width:100%;background:color-mix(in srgb,#E0A15B 70%,var(--rule));border-radius:2px 2px 0 0}
.edrow span{font-family:'Barlow Condensed',sans-serif;font-size:10px;color:var(--dim)}
.edrow b{font-family:'Archivo Black',sans-serif;font-size:9.5px;color:var(--chalk);font-weight:400}
.trophy{position:absolute;right:-8px;top:-5px;min-width:24px;height:22px;padding:0 4px;border-radius:11px;background:var(--brass);color:#181200;
  border:2px solid var(--court);font-family:'Archivo Black',sans-serif;font-size:10.5px;display:flex;align-items:center;justify-content:center}

/* ---------- menu bar ---------- */
#menu{flex:0 0 auto;display:flex;background:var(--bg1);border-bottom:1px solid var(--line)}
#menu button+button{border-left:1px solid var(--line)}
#menu button{flex:1 1 0;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 8px;background:var(--bg1);
  font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:13.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);transition:background .13s,color .13s}
#menu button span{font-size:9px;color:var(--team-accent)}
#menu button:hover{background:var(--bg2);color:var(--strong)}
#menu button:active{background:color-mix(in srgb,var(--team) 25%,var(--bg1))}
@media (min-width:1101px){#menu{justify-content:flex-start}#menu button{flex:0 0 auto;padding:10px 26px}#menu button:last-child{border-right:1px solid var(--line)}}
/* ---------- leaders season slider ---------- */
.lslide{display:flex;align-items:center;gap:12px;max-width:940px;width:100%;margin:0 auto 12px;padding:8px 12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.lslide input{flex:1 1 auto;accent-color:var(--brass);min-width:0}
.lslide b{font-family:'Archivo Black',sans-serif;font-size:14px;color:var(--strong);min-width:64px}
.lslide.past{border-color:var(--brass)}
.lslide[hidden]{display:none}
.shotslide{margin:0 0 10px;padding:6px 10px}
.keepspace{visibility:hidden}

/* ---------- light theme fixes for accent colors ---------- */
:root[data-theme="light"] .tagpill.live,:root[data-theme="light"] .gstat .lv,:root[data-theme="light"] .gsc div.lv,:root[data-theme="light"] .pline.live{color:#B02E24}
:root[data-theme="light"] .tagpill.live{border-color:#C94A3F}
:root[data-theme="light"] .pline.live b{color:var(--strong)}
:root[data-theme="light"] .opt.P{color:#2A5C9E;border-color:#6E9FD8} :root[data-theme="light"] .opt.E{color:#654A99;border-color:#A98BD0}
:root[data-theme="light"] .pk .cnt.z{background:#F7DCDC;color:#962828} :root[data-theme="light"] .pk .cnt.m{background:#D6F0E1;color:#1B6A3D}
:root[data-theme="light"] .k2,:root[data-theme="light"] .trophy{color:#fff;border-color:var(--court)}
:root[data-theme="light"] .gcard.live{border-color:#C94A3F}
:root[data-theme="light"] .play.score{background:linear-gradient(90deg,color-mix(in srgb,var(--brass) 14%,transparent),transparent 60%)}
:root[data-theme="light"] .face{box-shadow:0 1px 4px rgba(60,40,20,.25)}
:root[data-theme="light"] #head{background:linear-gradient(180deg,color-mix(in srgb,var(--team) 10%,transparent),transparent)}
#themebtn{margin-left:auto}
@media (max-width:1100px){#themebtn{flex:0 0 auto;margin-left:0;padding:10px 14px}}

/* ---------- play by play by quarter ---------- */
details.qtr{border:1px solid var(--line);border-radius:var(--r);margin-bottom:6px;background:var(--panel);overflow:hidden}
details.qtr summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 12px;flex-wrap:wrap}
details.qtr summary::-webkit-details-marker{display:none}
details.qtr summary::before{content:"▸";color:var(--team-accent);font-size:12px;transition:transform .15s}
details.qtr[open] summary::before{transform:rotate(90deg)}
details.qtr .qn{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--strong)}
details.qtr .qn em{font-style:normal;color:#E0402A;margin-left:4px}
details.qtr .qs{font-family:'Barlow Condensed',sans-serif;font-size:13px;color:var(--chalk)}
details.qtr .qc{margin-left:auto;font-family:'Barlow Condensed',sans-serif;font-size:12px;color:var(--dim)}
details.qtr .qbody{padding:0 12px 6px;border-top:1px solid var(--rule)}
.play{grid-template-columns:46px 22px 1fr auto 22px}
.play .rp{color:var(--team-accent);text-decoration:none;font-size:12px;text-align:center}
.play .rp:hover{color:var(--strong)}
a.more.replay{display:block;text-align:center;text-decoration:none;margin:0 0 4px}
@media (max-width:640px){.play{grid-template-columns:40px 18px 1fr auto 18px}}
/* ---------- standings ---------- */
#stand{position:fixed;inset:0;z-index:66;background:var(--ink);display:flex;flex-direction:column;
  padding:calc(16px + env(safe-area-inset-top,0px)) 18px calc(12px + env(safe-area-inset-bottom,0px))}
#stand[hidden]{display:none}
#stbody{flex:1 1 auto;overflow-y:auto;max-width:1000px;width:100%;margin:0 auto}
.stconf{margin-bottom:18px}
.stconf h3{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:.13em;text-transform:uppercase;color:var(--strong);margin-bottom:6px}
.tb.st td,.tb.st th{padding:7px 6px}
.tb.st td.sd{font-family:'Archivo Black',sans-serif;font-size:12px;color:var(--dim);text-align:right;width:22px}
.tb.st td.stn{text-align:left;white-space:nowrap;font-size:13.5px}
.tb.st td.stn img{width:20px;height:20px;object-fit:contain;vertical-align:-5px;margin-right:8px}
.tb.st td.stn .cl{font-family:'Barlow Condensed',sans-serif;font-size:11px;color:var(--dim)}
.tb.st tr[data-st-team]{cursor:pointer}
.tb.st tr[data-st-team]:hover td{background:var(--hover)}
.tb.st tr.mine td{background:color-mix(in srgb,var(--team) 14%,transparent)}
.tb.st tr.cut6 td{border-bottom:2px solid var(--team-accent)}
.tb.st tr.cut10 td{border-bottom:2px dashed var(--line)}
/* ---------- matchup preview ---------- */
.pvhead{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:4px 0 12px}
.pvhead>div{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.pvhead img{width:48px;height:48px;object-fit:contain}
.pvhead b{font-family:'Archivo Black',sans-serif;font-size:14px;color:var(--strong)}
.pvhead span{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:var(--dim)}
.pvvs{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.14em;color:var(--dim)}
.pvcols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px}
.pvp{display:grid;grid-template-columns:40px 26px 1fr;grid-template-rows:auto auto;column-gap:8px;align-items:center;width:100%;text-align:left;padding:6px 0;border-bottom:1px solid var(--rule)}
.pvp .pvf{grid-row:1/3;width:40px;height:40px;border-radius:50%;overflow:hidden;background:var(--face)}
.pvp .pvf img{width:100%;height:100%;object-fit:cover;object-position:top}
.pvp .pvf .fallback{font-size:12px}
.pvp .pvs{grid-row:1/3;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;color:var(--dim)}
.pvp .pvn{font-size:13.5px;color:var(--chalk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pvp .pvl{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:var(--dim)}
.pvp .pvl b{color:var(--brass)}
.crow .cv small{font-family:'Barlow Condensed',sans-serif;font-size:11px;margin:0 3px}
@media (max-width:640px){.pvcols{grid-template-columns:1fr}}
/* ---------- on/off ---------- */
.oob{flex:0 0 90px;height:8px;background:var(--rule);border-radius:4px;position:relative;overflow:hidden}
.oob i{position:absolute;top:0;bottom:0;border-radius:4px}
.oob::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--dim)}

/* ---------- scores view: keep tables inside the page edges ---------- */
#scbody .scroll{margin:0;position:relative}
#scbody .tb th:first-child,#scbody .tb td:first-child{padding-left:8px}
#scbody .tb th:last-child,#scbody .tb td:last-child{padding-right:8px}
#scbody .boxteam .tb th:first-child,#scbody .boxteam .tb td:first-child{position:sticky;left:0;z-index:1;background:var(--ink);box-shadow:6px 0 6px -6px rgba(0,0,0,.35)}
#scbody .boxteam .scroll{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 18px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 18px),transparent)}
#scbody .boxteam .scroll.end{-webkit-mask-image:none;mask-image:none}
#scbody .boxteam h4,#scbody .lsc{padding-left:2px}
#scbody .qbody{padding:0 10px 6px 12px}
#scbody .play .pc{padding-left:2px}
#scbody .pfilt,#scbody .wp,#scbody .gnote{padding:0 2px}
/* ---------- play style ---------- */
.styhead,.styrow{display:grid;grid-template-columns:minmax(92px,1.1fr) minmax(60px,1fr) 56px 60px;gap:9px;align-items:center}
.styhead{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding:2px 0 6px;border-bottom:1px solid var(--rule)}
.styhead span:nth-child(n+3){text-align:right}
.styrow{padding:7px 0;border-bottom:1px solid var(--rule)}
.styl b{display:block;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:13.5px;letter-spacing:.04em;color:var(--chalk)}
.stykey{margin-top:10px;font-size:12.5px;color:var(--mute)}
.stykey summary{cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--team-accent)}
.stykey div{padding:4px 0;border-bottom:1px solid var(--rule)}
.stykey b{color:var(--chalk);font-weight:600}
.stybar{position:relative;height:9px;background:var(--rule);border-radius:4px}
.stybar i{position:absolute;left:0;top:0;bottom:0;background:var(--team-accent);border-radius:4px}
.stybar em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--strong);opacity:.7}
.lgkey{display:inline-block;width:2px;height:10px;background:var(--strong);opacity:.7;vertical-align:-1px;margin:0 3px}
.styv{text-align:right}
.styv b{display:block;font-family:'Archivo Black',sans-serif;font-size:13px;color:var(--strong)}
.styv small{display:block;font-family:'Barlow Condensed',sans-serif;font-size:11px;color:var(--dim)}
@media (max-width:640px){.styhead,.styrow{grid-template-columns:minmax(86px,1.1fr) minmax(50px,.8fr) 50px 54px;gap:7px}}

/* shot chart season slider: the chart dims slightly while a season loads, never blanks */
#pshots.loading .shotbody{opacity:.55;transition:opacity .15s}
.shotslide input{touch-action:pan-y}

/* ---------- embedded player ---------- */
.pwrap{margin-bottom:12px}
.pbar{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.plab{flex:1 1 auto;font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.pbtn{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);border:1px solid var(--line);padding:4px 11px;border-radius:var(--r);text-decoration:none;background:none}
.pbtn:hover{color:var(--strong);border-color:var(--team-accent)}
/* sixteen by nine, reserved before the frame loads so nothing below it jumps */
.pframe{position:relative;width:100%;aspect-ratio:16/9;background:#000;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pframe[hidden]{display:none}
.pframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.gstream{display:inline-block;margin-top:8px;font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#F2B0B0;text-decoration:none;border:1px solid #D06A6A;border-radius:var(--r);padding:3px 10px}
:root[data-theme="light"] .gstream{color:#B02E24;border-color:#C94A3F}

/* ---------- feed delay ---------- */
.dlbar{display:flex;align-items:center;gap:7px;margin-top:8px;flex-wrap:wrap}
.dlbar .plab{flex:0 0 auto}
.dlrange{flex:1 1 140px;accent-color:var(--brass);min-width:120px}
.dlv{font-family:'Archivo Black',sans-serif;font-size:13px;color:var(--strong);min-width:38px;text-align:right}
.dlsync{margin-top:6px}
.dlsync b{color:var(--strong)}

/* ---------- demo live game ---------- */
.demobar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;padding:9px 12px;border:1px dashed var(--brass);border-radius:var(--r);font-size:13px;color:var(--chalk);background:color-mix(in srgb,var(--brass) 8%,transparent)}
.demobar b{font-family:'Barlow Condensed',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
.demobar .pbtn{margin-left:auto}
.pdemo{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#9fb0aa;font-family:'Barlow Condensed',sans-serif;letter-spacing:.08em;text-align:center;padding:10px;
  background:repeating-linear-gradient(135deg,#0d1316 0 14px,#111a1e 14px 28px)}
.pdemo b{font-size:15px;text-transform:uppercase;color:#d5dedb}
.pdemo span{font-size:12px;word-break:break-all}
.demobtn{border-color:var(--brass)!important;color:var(--brass)!important}

/* ---------- stream dock: one player, docked in the game view or floating ---------- */
#streamdock{position:fixed;z-index:90;background:#000;border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
#streamdock[hidden]{display:none}
#streamdock .sdbar{display:none}
#streamdock .sdframe{position:relative;flex:1 1 auto}
#streamdock .sdframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#streamdock.floating{width:min(360px,58vw);height:auto;box-shadow:0 12px 34px rgba(0,0,0,.45);border:1px solid var(--line)}
#streamdock.floating .sdframe{aspect-ratio:16/9;flex:0 0 auto}
#streamdock.floating[data-corner="br"]{right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px))}
#streamdock.floating[data-corner="bl"]{left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px))}
#streamdock.floating[data-corner="tr"]{right:12px;top:calc(12px + env(safe-area-inset-top,0px))}
#streamdock.floating[data-corner="tl"]{left:12px;top:calc(12px + env(safe-area-inset-top,0px))}
#streamdock.floating .sdbar{display:flex;align-items:center;gap:6px;padding:5px 6px 5px 10px;background:#0E1518;cursor:grab;touch-action:none;user-select:none}
#streamdock.dragging{transition:none;opacity:.92}
#streamdock.dragging .sdbar{cursor:grabbing}
.sdt{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'Barlow Condensed',sans-serif;font-size:12.5px;letter-spacing:.06em;color:#EAF1ED}
.sdb{flex:0 0 auto;font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#EAF1ED;border:1px solid #566C77;border-radius:var(--r);padding:3px 9px;background:none}
.sdb:hover{border-color:#D9B84A;color:#fff}
.sdb[data-sd="close"]{padding:2px 8px;font-size:15px;line-height:1}
#livechip{position:fixed;z-index:89;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:9px 14px;border-radius:20px;border:1px solid #D06A6A;background:var(--panel);color:var(--strong);
  font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:.08em;text-transform:uppercase;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#livechip[hidden]{display:none}
.pframe{background:transparent}

/* ---------- highlights ---------- */
.hlwrap{margin-bottom:12px}
.hlframe{position:relative;width:100%;aspect-ratio:16/9;background:#000;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.hlframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.hlwait{display:flex;align-items:center;justify-content:center;color:#9fb0aa;font-family:'Barlow Condensed',sans-serif;letter-spacing:.08em}
.hlpick{margin-top:8px}
.ghl{display:inline-block;margin-top:8px;font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--team-accent)}

/* ---------- Top 10 plays of the night ---------- */
.t10{margin-top:16px;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.t10h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:.13em;text-transform:uppercase;color:var(--strong);margin-bottom:10px}
.t10h span{font-weight:600;font-size:12px;letter-spacing:.06em;color:var(--dim)}
.t10v{position:relative;display:block;width:100%;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:#000;padding:0}
.t10v img{width:100%;height:100%;object-fit:cover;display:block}
.t10p{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:rgba(224,64,42,.92);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;padding-left:4px;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.t10v:hover .t10p{transform:translate(-50%,-50%) scale(1.06)}
.t10frame{position:relative;width:100%;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:#000}
.t10frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.t10t{font-size:13px;color:var(--chalk);margin-top:6px}
/* ---------- impact, skills, clutch, player of the night ---------- */
.radar{display:block;width:100%;max-width:300px;margin:0 auto}
.skrow{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:6px}
.skrow span{text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.skrow b{display:block;font-family:'Archivo Black',sans-serif;font-size:14px;color:var(--strong);letter-spacing:0}
.qbars{display:flex;align-items:flex-end;gap:10px;height:90px;margin-top:6px}
.qbars div{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.qbars i{width:70%;background:var(--team-accent);border-radius:3px 3px 0 0;min-height:3px}
.qbars b{font-family:'Archivo Black',sans-serif;font-size:11.5px;color:var(--strong);margin-bottom:3px}
.qbars span{font-family:'Barlow Condensed',sans-serif;font-size:11px;color:var(--dim);margin-top:3px}
.potn{display:flex;gap:14px;align-items:center;width:100%;text-align:left;margin-top:14px;padding:12px;border:1px solid var(--brass);border-radius:var(--r);background:color-mix(in srgb,var(--brass) 8%,var(--panel))}
.potnf{flex:0 0 64px;height:64px;border-radius:50%;overflow:hidden;background:var(--face)}
.potnf img{width:100%;height:100%;object-fit:cover;object-position:top}
.potni{display:flex;flex-direction:column;gap:2px;min-width:0}
.potni em{font-style:normal;font-family:'Barlow Condensed',sans-serif;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
.potni b{font-family:'Archivo Black',sans-serif;font-size:17px;color:var(--strong)}
.potni span{font-size:13.5px;color:var(--chalk);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.potni span img{width:18px;height:18px;object-fit:contain}
.potni small{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:var(--dim)}
/* ---------- other games strip at the top of the live game view ---------- */
#striphost:empty{display:none}
.gsrail{display:flex;gap:7px;overflow-x:auto;padding:0 0 10px;margin-bottom:10px;border-bottom:1px solid var(--rule);scrollbar-width:thin}
.gsrail::-webkit-scrollbar{height:4px}
.gsrail::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}
.gstile{position:relative;flex:0 0 auto;min-width:112px;padding:7px 9px 6px 12px;text-align:left;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden;transition:border-color .12s,background .12s}
.gstile:hover{border-color:var(--team-accent)}
.gstile.live{border-color:color-mix(in srgb,#C25B5B 45%,transparent)}
.gstile.done{opacity:.72}
.gstile.on{border-color:var(--brass);background:color-mix(in srgb,var(--brass) 12%,var(--panel));opacity:1}
.gsside{position:relative;display:flex;align-items:center;gap:6px;padding:1px 0}
.gsside .gcstripe{position:absolute;left:-12px;top:0;bottom:0;width:4px;border-radius:0 2px 2px 0}
.gslogo{width:16px;height:16px;object-fit:contain;flex:0 0 auto}
.gsab{flex:1 1 auto;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:12px;letter-spacing:.07em;color:var(--mute)}
.gssc{font-family:'Archivo Black',sans-serif;font-size:12.5px;color:var(--dim);min-width:22px;text-align:right}
.gssc.lead{color:var(--strong)}
.gsfoot{display:flex;align-items:center;gap:5px;margin-top:4px;font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.gsfoot.hot{color:#E0453A;font-weight:700}
:root[data-theme="light"] .gsfoot.hot{color:#C22B20}
.gsdot{width:6px;height:6px;border-radius:50%;background:#E05B5B;animation:pulse 1.6s ease-in-out infinite;flex:0 0 auto}

/* stream 1 / stream 2 switch */
.pseg{display:inline-flex;gap:0}
.pseg .pbtn{border-radius:0}
.pseg .pbtn:first-child{border-radius:var(--r) 0 0 var(--r)}
.pseg .pbtn:last-child{border-radius:0 var(--r) var(--r) 0;border-left:0}
.pseg .pbtn[aria-pressed="true"]{background:color-mix(in srgb,var(--team) 28%,transparent);color:var(--strong);border-color:var(--team-accent)}
.pspace{flex:1 1 auto}
.pbar .pbtn{white-space:nowrap}
@media (max-width:480px){.pbar{gap:5px}.pbar .pbtn{padding:4px 8px;letter-spacing:.06em}}
#foot{flex:0 0 auto;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:7px 18px calc(7px + env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--line);font-family:'Barlow Condensed',sans-serif;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);background:var(--bg1)}

/* ---------- responsive ---------- */
@media (max-width:1100px){
  body{overflow:auto}
  #app{height:auto;min-height:100%}
  #split{flex-direction:column}
  #detail{flex:1 1 auto;border-left:0;border-top:1px solid var(--line)}
  #floor{width:100%}
}
@media (max-width:640px){
  .dgroup{padding:6px 9px 7px;gap:4px}
  .dlabel{font-size:10px}
  .tbtn{width:32px;height:32px;padding:3px}
  #head{padding:12px 14px 11px}
  #hlogo{width:40px;height:40px}
  #floorwrap{padding:12px 10px 10px}
  #floor{aspect-ratio:1000/940}
  .chip{width:62px}
  .disc{width:56px;height:56px}
  .face{border-width:2px}
  .jersey{min-width:21px;height:21px;font-size:11px;right:-5px}
  .slot{height:18px;font-size:10.5px;left:-8px;padding:0 4px}
  .pname{font-size:12.5px;width:104px}
  .pline{font-size:11px;top:calc(100% + 18px)}
  #bench{grid-template-columns:repeat(2,minmax(0,1fr))}
  #detail{padding:14px 12px 24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <nav id="rail" aria-label="Teams"></nav>
  <nav id="menu" aria-label="Menu">
    <button id="scbtn"><span aria-hidden="true">●</span>Scores</button>
    <button id="stbtn"><span aria-hidden="true">■</span>Standings</button>
    <button id="leadbtn"><span aria-hidden="true">▲</span>Leaders</button>
    <button id="boardbtn"><span aria-hidden="true">◆</span>Draft</button>
    <button id="themebtn" aria-label="Switch between light and dark"></button>
  </nav>
  <div id="searchbar">
    <span class="mag" aria-hidden="true">&#9906;</span>
    <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Search players and teams" aria-label="Search players and teams">
    <div id="results" hidden role="listbox"></div>
  </div>
  <header id="head">
    <div id="hl">
      <img id="hlogo" alt="">
      <div>
        <h1 id="tname" class="blk"></h1>
        <div id="trec"></div>
      </div>
    </div>
    <div id="hr" role="group" aria-label="Panel">
      <button id="vteam" aria-pressed="true">Team stats</button>
      <button id="vplayer" aria-pressed="false">Player</button>
    </div>
  </header>
  <div id="split">
    <main id="floorwrap">
      <div id="timebar"><span id="timelab"></span><input id="time" type="range" min="0" max="0" value="0" aria-label="Season"><button class="barbtn" id="timenow" hidden>Back to today</button></div>
      <div class="tticks" id="tticks"></div>
      <div id="floorbar">
        <div class="hint" id="lineupnote"></div>
        <div style="display:flex;gap:10px;align-items:center"><span class="hint">Tap a player for his numbers</span></div>
      </div>
      <div id="floor">
        <svg id="court" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
        <div id="chips"></div>
      </div>
      <div id="benchhead"><h2>Bench</h2><span class="hint" id="benchnote">Ordered by minutes</span></div>
      <div id="bench"></div>
    </main>
    <aside id="detail" aria-live="polite"></aside>
  </div>
  <footer id="foot"><span id="src"></span><span id="stamp"></span></footer>
</div>

<div id="lead" hidden role="dialog" aria-modal="true" aria-label="League leaders">
  <div class="lhead"><h2 id="leadh">League leaders</h2><button class="qx" id="leadclose">Close</button></div>
  <div class="lslide" id="lslide"><b id="lslab"></b><input type="range" id="lsrange" min="0" max="0" value="0" aria-label="Season"><button class="qx" id="lsnow">Latest</button></div>
  <div class="lslide" id="dslide" hidden><b id="dslab"></b><input type="range" id="dsrange" min="0" max="0" value="0" aria-label="Draft year"><button class="qx" id="dsnow">Upcoming</button></div>
  <div class="lsplit"><div class="lcats" id="lcats"></div><div class="lrows" id="lrows"></div></div>
</div>

<div id="scores" hidden role="dialog" aria-modal="true" aria-label="Scores and live games">
  <div class="lhead"><h2>Scores</h2><button class="qx" id="scclose">Close</button></div>
  <div class="dnav" id="scnav"></div>
  <div id="scbody"></div>
</div>

<div id="cmp" hidden role="dialog" aria-modal="true" aria-label="Compare players">
  <div class="lhead"><h2>Compare players</h2><button class="qx" id="cmpclose">Close</button></div>
  <div id="cmpbody"></div>
</div>

<div id="stand" hidden role="dialog" aria-modal="true" aria-label="Standings">
  <div class="lhead"><h2 id="standh">Standings</h2><button class="qx" id="stclose">Close</button></div>
  <div class="lslide"><b id="stlab"></b><input type="range" id="strange" min="0" max="0" value="0" aria-label="Season"><button class="qx" id="stnow">Latest</button></div>
  <div id="stbody"></div>
</div>

<script id="nba-data" type="application/json">{}</script>
<script>
"use strict";
/* ---------- theme: saved choice, otherwise the device setting ---------- */
function savedTheme(){ try { return localStorage.getItem('nba_theme'); } catch (e){ return null; } }
function applyTheme(th){
  document.documentElement.dataset.theme = th;
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = th === 'light' ? '#F3F0E9' : '#0E1417';
  const b = document.getElementById('themebtn'); if (b) b.innerHTML = th === 'light' ? '<span aria-hidden="true">☾</span>Dark' : '<span aria-hidden="true">☀</span>Light';
}
const isLight = () => document.documentElement.dataset.theme === 'light';
applyTheme(savedTheme() || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
const D = JSON.parse(document.getElementById('nba-data').textContent);
const T = D.teams, P = D.players, M = D.meta;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const byAbbr = {}; for (const id in T) byAbbr[T[id].abbr] = id;
const SLOTS = ['PG','SG','SF','PF','C'];
// Spots on a half court with the basket at the top (percent of the floor box)
// Spots in feet: x across the 50 ft width, y out from the baseline
const SPOT = {PG:[25,23.5], SG:[41.5,16.5], SF:[8.5,16.5], PF:[16.5,7.5], C:[33.5,7.5]};
const SPOT_M = {PG:[25,36], SG:[41.5,24], SF:[8.5,24], PF:[14.5,9], C:[35.5,9]};
const isMob = () => matchMedia('(max-width:640px)').matches;
const depthFt = () => isMob() ? 47 : 31;

let cur = null, curP = null, view = 'team', logOpen = false;

/* ---------- helpers ---------- */
// Photo sources, tried in order: current players ESPN first (freshest), everyone else
// NBA.com first (official headshots back to the league's early years), then ESPN,
// then Basketball Reference, then a Wikimedia Commons photo.
const ESPN_IMG = id => `https://a.espncdn.com/combiner/i?img=/i/headshots/nba/players/full/${id}.png&w=260&h=190`;
function photoList(id){
  id = String(id);
  const ph = (D.photos || {})[id] || [0, ''], out = [];
  const nba = ph[0] ? `https://cdn.nba.com/headshots/nba/latest/260x190/${ph[0]}.png` : null;
  const espnU = /^\d+$/.test(id) ? ESPN_IMG(id) : null;
  const bbr = id.startsWith('b:') ? `https://www.basketball-reference.com/req/202106291/images/headshots/${id.slice(2)}.jpg` : null;
  const com = ph[1] ? `https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(ph[1])}?width=260` : null;
  if (P[id]) out.push(espnU, nba, com); else out.push(nba, espnU, bbr, com);
  return out.filter(Boolean);
}
const img = id => photoList(id)[0] || '';
// Build an <img> that moves to the next source on error; mode 'ini' swaps in initials at the end, 'hide' hides it
function photo(id, name, mode = 'ini', cls = 'fallback', extra = ''){
  const L = photoList(id); if (!L.length) return mode === 'ini' ? `<div class="${cls}">${esc(initials(name || ''))}</div>` : '';
  return `<img src="${esc(L[0])}" alt="" loading="lazy" ${extra} data-alt="${esc(L.slice(1).join('|'))}" data-ini="${esc(initials(name || ''))}" data-mode="${mode}" data-cls="${cls}" onerror="nextPhoto(this)">`;
}
function nextPhoto(el){
  const rest = (el.dataset.alt || '').split('|').filter(Boolean);
  if (rest.length){ el.dataset.alt = rest.slice(1).join('|'); el.src = rest[0]; return; }
  if (el.dataset.mode === 'ini') el.replaceWith(Object.assign(document.createElement('div'), {className: el.dataset.cls || 'fallback', textContent: el.dataset.ini || ''}));
  else el.style.visibility = 'hidden';
}
const initials = n => n.split(' ').filter(Boolean).slice(0,2).map(w => w[0]).join('');
function face(id, cls = 'fallback'){
  const p = P[id];
  return photo(id, p.n, 'ini', cls);
}
function ord(n){ const s = ['th','st','nd','rd'], v = n % 100; return n + (s[(v-20)%10] || s[v] || s[0]); }
function rkClass(r, n){ return r <= n/3 ? 'good' : r > n*2/3 ? 'low' : 'mid'; }
const f1 = v => v == null ? '—' : (+v).toFixed(1);
const pct = v => v == null ? '—' : (+v).toFixed(1) + '%';

function hexLum(h){
  const c = h.match(/../g).map(x => parseInt(x,16)/255).map(v => v <= .03928 ? v/12.92 : ((v+.055)/1.055)**2.4);
  return .2126*c[0] + .7152*c[1] + .0722*c[2];
}
function mix(h, w, t){ // blend hex h toward white by t
  const a = h.match(/../g).map(x => parseInt(x,16));
  return '#' + a.map(v => Math.round(v + (w - v)*t).toString(16).padStart(2,'0')).join('');
}
function teamColors(t){
  let c = (t.color || '4A7C6F').toLowerCase();
  if (hexLum(c) < .045 && t.alt && hexLum(t.alt) > hexLum(c)) c = t.alt.toLowerCase();
  let base = '#' + c;
  let acc = c; let i = 0;
  if (isLight()){ while (hexLum(acc) > .16 && i < 14){ acc = mix(acc, 0, .12).slice(1); i++; } }
  else { while (hexLum(acc) < .22 && i < 12){ acc = mix(acc, 255, .12).slice(1); i++; } }
  const r = document.documentElement.style;
  r.setProperty('--team', base);
  r.setProperty('--team-accent', '#' + acc);
  r.setProperty('--team2', hexLum(c) > .35 ? '#0E1417' : '#FFFFFF');
}

/* ---------- rail ---------- */
function buildRail(){
  const conf = {East:['Atlantic','Central','Southeast'], West:['Northwest','Pacific','Southwest']};
  let h = '';
  for (const c of ['East','West']) for (const d of conf[c]){
    h += `<div class="dgroup"><div class="dlabel">${d}</div><div class="dteams">` +
      D.divs[d].map(a => { const id = byAbbr[a]; if (!id) return '';
        return `<button class="tbtn" data-t="${id}" title="${esc(T[id].name)}" aria-label="${esc(T[id].name)}"><img src="${T[id].logo}" alt=""></button>`; }).join('') +
      `</div></div>`;
  }
  $('#rail').innerHTML = h;
  $('#rail').onclick = e => { const b = e.target.closest('.tbtn'); if (b) setTeam(b.dataset.t); };
}

/* ---------- court ---------- */
function drawCourt(){
  // 50 ft wide half court scaled to 1000 wide; 20 units per foot; basket 5.25 ft from baseline
  const F = 20, cx = 500, by = 5.25*F, ln = 'var(--courtline)', HH = depthFt()*F;
  $('#court').setAttribute('viewBox', `0 0 1000 ${HH}`);
  const arcR = 23.75*F, cornerX = 22*F, cornerY = by + Math.sqrt(arcR*arcR - cornerX*cornerX);
  let s = '';
  s += `<defs><pattern id="planks" width="40" height="${HH}" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="${HH}" stroke="var(--plank)" stroke-width="1"/></pattern></defs>`;
  s += `<rect width="1000" height="${HH}" fill="url(#planks)"/>`;
  s += `<rect x="${cx-8*F}" y="0" width="${16*F}" height="${19*F}" fill="var(--team)" fill-opacity=".30" stroke="${ln}" stroke-width="2.5"/>`;
  s += `<path d="M ${cx-6*F} ${19*F} A ${6*F} ${6*F} 0 0 0 ${cx+6*F} ${19*F}" fill="none" stroke="${ln}" stroke-width="2.5"/>`;
  s += `<path d="M ${cx-6*F} ${19*F} A ${6*F} ${6*F} 0 0 1 ${cx+6*F} ${19*F}" fill="none" stroke="${ln}" stroke-width="2" stroke-dasharray="10 9"/>`;
  if (HH >= 47*F){
    s += `<line x1="0" y1="${HH-1.5}" x2="1000" y2="${HH-1.5}" stroke="${ln}" stroke-width="3"/>`;
    s += `<path d="M ${cx-6*F} ${HH} A ${6*F} ${6*F} 0 0 1 ${cx+6*F} ${HH}" fill="none" stroke="${ln}" stroke-width="2.5"/>`;
  }
  s += `<path d="M ${cx-cornerX} 0 L ${cx-cornerX} ${cornerY} A ${arcR} ${arcR} 0 0 0 ${cx+cornerX} ${cornerY} L ${cx+cornerX} 0" fill="none" stroke="${ln}" stroke-width="2.5"/>`;
  s += `<path d="M ${cx-4*F} ${by} A ${4*F} ${4*F} 0 0 0 ${cx+4*F} ${by}" fill="none" stroke="${ln}" stroke-width="2"/>`;
  s += `<line x1="${cx-3*F}" y1="${4*F}" x2="${cx+3*F}" y2="${4*F}" stroke="var(--rimline)" stroke-width="4"/>`;
  s += `<circle cx="${cx}" cy="${by}" r="${0.75*F}" fill="none" stroke="#E0A15B" stroke-width="3"/>`;
  $('#court').innerHTML = s;
}

/* ---------- team ---------- */
function setTeam(id, keepPlayer){
  cur = id; const t = T[id];
  teamColors(t);
  document.querySelectorAll('.tbtn').forEach(b => b.setAttribute('aria-current', b.dataset.t === id));
  const act = document.querySelector(`.tbtn[data-t="${id}"]`); if (act) act.scrollIntoView({block:'nearest',inline:'nearest'});
  $('#hlogo').src = t.logo; $('#tname').textContent = t.name;
  const r = t.rec;
  let rec = '';
  if (r) rec += `<span class="wl">${esc(r.rec)}</span><span class="tagpill${r.seed && r.seed <= 6 ? ' gold' : ''}">${r.seed ? ord(r.seed) + ' in the ' : ''}${t.conf}</span>`;
  rec += `<span class="tagpill">${t.div}</span>${t.coach ? `<span class="tagpill">Coach ${esc(t.coach.name)}</span>` : ''}<span class="tagpill" id="livepill" hidden></span>`;
  $('#trec').innerHTML = rec;
  $('#lineupnote').textContent = t.note;

}

function liveLine(id){
  const L = LIVE && LIVE.team === String(cur) && LIVE.stats[id];

function lastPlayed(p){ return p.yr && p.yr.length ? p.yr[p.yr.length - 1] : null; }
function statLine(id){
  const s = P[id].s, lp = lastPlayed(P[id]);
  if (!s && lp) return isMob() ? `<b>${f1(lp[5])}</b> ppg ${lp[0]}` : `<b>${f1(lp[5])}</b> pts <b>${f1(lp[6])}</b> reb <b>${f1(lp[7])}</b> ast in ${lp[0]}`;

function setView(v){

function openPlayer(id){
  const p = P[id];

function marginChart(g){
  if (!g || !g.length) return '<p class="note">No games yet.</p>';
  const W = 340, H = 120, mid = H/2, max = Math.max(20, ...g.map(x => Math.abs(x[3]-x[4])));
  const bw = W / g.length;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Margin of every game">`;
  s += `<line x1="0" y1="${mid}" x2="${W}" y2="${mid}" stroke="var(--line)" stroke-width="1"/>`;
  g.forEach((x, i) => {
    const m = x[3]-x[4], hgt = Math.max(1.5, Math.abs(m)/max*(mid-4));
    const col = x[5] === 3 ? 'var(--brass)' : m > 0 ? '#5FBF8A' : '#C98080';
    s += `<rect x="${(i*bw+.3).toFixed(2)}" y="${m > 0 ? mid-hgt : mid}" width="${Math.max(bw-.6,.8).toFixed(2)}" height="${hgt.toFixed(1)}" fill="${col}"><title>${x[0]} ${x[2] || 'vs '}${x[1]} ${x[3]}-${x[4]}</title></rect>`;
  });
  return s + '</svg>';
}
function ageChart(ids){
  const bins = [['Under 23',0,22],['23 to 26',23,26],['27 to 30',27,30],['31 plus',31,99]];
  const c = bins.map(b => ids.filter(i => P[i].age >= b[1] && P[i].age <= b[2]).length), mx = Math.max(...c, 1);
  return bins.map((b, k) => `<div class="stat"><span class="l">${b[0]}</span><span class="bar" style="flex-basis:150px"><i style="width:${c[k]/mx*100}%"></i></span><span class="v" style="min-width:26px">${c[k]}</span></div>`).join('');
}

}

/* ---------- live stats on the floor ---------- */
let LIVE = null, liveTimer = null;
async function liveFloor(ev){
  try {
    const fresh = await espn('/summary?event=' + ev.id);
    keepSnap(ev.id, fresh);
    const buf = SNAPS[ev.id], cutoff = Date.now() - liveDelay * 1000;
    const pick = liveDelay ? [...buf].reverse().find(x => x.t <= cutoff) : buf[buf.length - 1];
    const s = pick ? pick.s : {boxscore: {players: []}, header: fresh.header};
    const map = {};
    for (const t of (s.boxscore?.players || [])){
      const st = t.statistics?.[0] || {}, names = st.names || st.labels || [];
      const ix = n => names.indexOf(n);
      for (const a of (st.athletes || [])) if (a.athlete?.id && (a.stats || []).length)
        map[a.athlete.id] = {pts: a.stats[ix('PTS')], reb: a.stats[ix('REB')], ast: a.stats[ix('AST')], min: a.stats[ix('MIN')]};
    }
    const state = s.header?.competitions?.[0]?.status?.type?.state;
    LIVE = {event: ev.id, state, stats: map, team: String(cur)};
    renderFloor(); renderBench();
    clearTimeout(liveTimer);
    if (state === 'in') liveTimer = setTimeout(() => liveFloor(ev), liveDelay ? 10000 : 30000);
  } catch (e){ /* live box score unavailable */ }
}

/* ---------- standings (built from ESPN and Basketball Reference records; live from ESPN in season) ---------- */
let standSeason = null, standLive = null;
function standSeasons(){ const s = new Set(); for (const id in T) for (const h of (T[id].hist || [])) if (h.conf) s.add(h.s); if (standLive) s.add(standLive.season); return [...s].sort(); }
function standRows(season){
  if (standLive && season === standLive.season) return standLive.rows;
  const rows = [];
  for (const id in T) for (const h of (T[id].hist || [])) if (h.s === season && h.conf) rows.push({id, ...h});
  return rows;
}
async function loadStandLive(){
  if (standLive !== null) return;
  standLive = false;
  try {
    const j = await (await fetch('https://site.api.espn.com/apis/v2/sports/basketball/nba/standings', {cache: 'no-store'})).json();
    const rows = [];
    for (const c of (j.children || [])){
      const conf = /east/i.test(c.name || c.abbreviation || '') ? 'East' : 'West';
      for (const e of (c.standings?.entries || [])){
        const st = {}; for (const x of (e.stats || [])) st[x.name || x.type] = x;
        const ab = e.team?.abbreviation, id = byAbbr[ab];
        if (!id) continue;
        const w = +(st.wins?.value || 0), l = +(st.losses?.value || 0);
        rows.push({id, conf, name: e.team.displayName, w, l, seed: st.playoffSeed?.value ? +st.playoffSeed.value : null,
          gb: st.gamesBehind?.displayValue, strk: st.streak?.displayValue, l10: (e.stats || []).find(x => /last ?ten/i.test(x.name || x.type || x.displayName || ''))?.displayValue,
          home: (e.stats || []).find(x => /home/i.test(x.name || x.type || ''))?.summary, road: (e.stats || []).find(x => /road|away/i.test(x.name || x.type || ''))?.summary,
          diff: st.differential?.displayValue || st.pointDifferential?.displayValue, cl: st.clincher?.displayValue});
      }
    }
    const season = j.seasons?.[0]?.displayName || j.season?.displayName || M.roster;
    if (rows.length >= 28 && rows.some(r => r.w + r.l > 0)) standLive = {season: season.length === 7 ? season : M.roster, rows};
  } catch (e){ /* live standings unavailable: use the built ones */ }
  if (!$('#stand').hidden) drawStandings();
}

/* ---------- on/off impact ---------- */
function onoffSection(p){

  const [mins, on, off, diff, tid] = o, tm = T[tid];

  const rk = mins >= 500 ? all.indexOf(diff) + 1 : null;
  const w = v => Math.min(50, Math.abs(v) / 20 * 50);
  const bar = v => `<span class="oob"><i style="${v >= 0 ? `left:50%;width:${w(v)}%;background:var(--good)` : `right:50%;width:${w(v)}%;background:var(--bad)`}"></i></span>`;
  return `<section class="sect k-rating"><h3>On/off impact<span>${esc(M.stats)}${tm ? ', ' + esc(tm.abbr) : ''}, ${mins.toLocaleString()} min</span></h3>
    <div class="stat"><span class="l">Team with him on the court<small>Points per 100 possessions, scored minus allowed</small></span>${bar(on)}<span class="v">${sg(on)}</span></div>
    <div class="stat"><span class="l">Team with him on the bench</span>${bar(off)}<span class="v">${sg(off)}</span></div>
    <div class="stat"><span class="l">Difference<small>How much better the team was with him playing</small></span>${bar(diff)}<span class="v ${diff > 0 ? 'good' : diff < 0 ? 'low' : ''}">${sg(diff)}</span>
      <span class="r ${rk ? rkClass(rk, all.length) : ''}">${rk ? ord(rk) : ''}</span></div>
    <p class="note">Rebuilt from every substitution in the play by play. It measures the whole lineup around him, so it rewards players on deep teams and is noisy in small minutes.${rk ? ` Rank is among ${all.length} players with 500+ minutes.` : ''}</p></section>`;

    const txt = p.text || '';
    if (!/substitution/i.test(p.type?.text || '') && !/ enters the game for /i.test(txt)) return null;
    const m = /^(.+?) enters the game for (.+?)\.?$/i.exec(txt.trim());
    const t0 = String(p.team?.id || '');
    if (m){
      for (const t of (R[t0] ? [t0] : Object.keys(R))){
        const a = byName[t + '|' + normName(m[1])], b = byName[t + '|' + normName(m[2])];
        if (a && b) return [t, a, b];
      }
    }
    const ids = (p.participants || []).map(x => String(x.athlete?.id || '')).filter(x => teamOf[x]);
    return ids.length >= 2 ? [teamOf[ids[0]], ids[0], ids[1]] : null;
  };
  const infer = (i0, per) => {
    const found = {}, came = {};
    for (const t in lineup){ found[t] = []; came[t] = new Set(); }
    for (let i = i0; i < plays.length && (plays[i].period?.number || 1) === per; i++){
      const p = plays[i], sb = subOf(p);
      if (sb){
        const [t, a, b] = sb;
        if (found[t]){ if (!came[t].has(b) && !found[t].includes(b) && found[t].length < 5) found[t].push(b); came[t].add(a); }
        continue;
      }
      if (/technical|ejection/i.test(p.type?.text || '')) continue;   // bench players can draw these
      for (const x of (p.participants || [])){
        const a = String(x.athlete?.id || ''), t = teamOf[a];
        if (t && !came[t].has(a) && !found[t].includes(a) && found[t].length < 5) found[t].push(a);
      }
      if (Object.values(found).every(v => v.length === 5)) break;
    }
    for (const t in found){
      guess[t] = new Set();
      for (const a of lineup[t]){
        if (found[t].length >= 5) break;
        if (!found[t].includes(a) && !came[t].has(a)){ found[t].push(a); guess[t].add(a); }
      }
      lineup[t] = new Set(found[t]);
    }
  };
  let per = 1; const entered = {}, seen = {};
  // take off the player most likely to be wrong: a guessed one first, then the one quiet longest
  const bump = t => {
    const out = [...lineup[t]].sort((m, n) => (guess[t].has(n) - guess[t].has(m)) || ((seen[m] ?? -1) - (seen[n] ?? -1)))[0];
    lineup[t].delete(out); guess[t].delete(out);
  };
  plays.forEach((p, i) => {
    const q = p.period?.number || 1;
    if (q !== per){ per = q; infer(i, q); }
    const sb = subOf(p);
    if (!sb){
      // ESPN's feed now and then drops a substitution. When a player who is not on the floor
      // shows up in a play, he must have come in: swap him for whoever has been quiet longest.
      if (/technical|ejection/i.test(p.type?.text || '')) return;
      for (const x of (p.participants || [])){
        const a = String(x.athlete?.id || ''), t = teamOf[a], L = lineup[t]; if (!L) continue;
        if (!L.has(a)){
          if (L.size >= 5) bump(t);
          L.add(a);
        }
        seen[a] = i;
      }
      return;
    }
    const [t, a, b] = sb, L = lineup[t]; if (!L) return;
    L.delete(b); guess[t].delete(b);
    if (!L.has(a)){ if (L.size >= 5) bump(t); L.add(a); }
    entered[a] = playTime(p); seen[a] = i;
  });
  // still short (a gap in the feed): fill with whoever on that team played most recently
  for (const t in lineup){
    const L = lineup[t];
    const cand = Object.keys(R[t].ath).filter(a => !L.has(a) && seen[a] != null).sort((m, n) => seen[n] - seen[m]);
    while (L.size < 5 && cand.length){ const a = cand.shift(); L.add(a); guess[t].add(a); }
  }
  return {R, lineup, entered};
}

/* ---------- demo live game: a real finished game replayed as if live ---------- */
// The 2026 Finals, Game 4: Spurs at Knicks, 107-106. The real play by play is fed in
// one play every 1.5 seconds from midway through the 2nd quarter, through the same
// live game view, delay and player code that a real game uses.
const DEMO_EVENT = '401859966', DEMO_STEP = 1500;
let demoSrc = null, demoStart = 0, demoFrom = 0;
async function demoSnapshot(){
  if (!demoSrc){
    demoSrc = await espn('/summary?event=' + DEMO_EVENT);
    const n = (demoSrc.plays || []).length;
    demoFrom = Math.floor(n * .35);
    demoStart = Date.now();
  }
  const all = demoSrc.plays || [];
  const k = Math.min(all.length, demoFrom + Math.floor((Date.now() - demoStart) / DEMO_STEP));
  // each play gets a clock time as if it just happened, so the feed delay works on it too
  const plays = all.slice(0, k).map((p, i) => ({...p, wallclock: new Date(demoStart + (i - demoFrom) * DEMO_STEP).toISOString()}));
  const last = plays[plays.length - 1];
  const done = k >= all.length;
  const c0 = demoSrc.header.competitions[0];
  const per = last?.period?.number;
  const comp = {...c0, competitors: c0.competitors.map(c => {
    const byQ = {}; let prev = 0;
    for (const p of plays) byQ[p.period?.number || 1] = c.homeAway === 'home' ? +p.homeScore : +p.awayScore;
    const ls = Object.keys(byQ).sort((a, b) => a - b).map(q => { const v = byQ[q] - prev; prev = byQ[q]; return {displayValue: String(v)}; });
    return {...c, score: String(last ? (c.homeAway === 'home' ? last.homeScore : last.awayScore) : 0), linescores: ls};
  }), status: {...c0.status, type: {...c0.status.type, state: done ? 'post' : 'in',
    shortDetail: done ? 'Final' : `${per <= 4 ? ['1st', '2nd', '3rd', '4th'][per - 1] : 'OT'} ${last?.clock?.displayValue || ''}`}}};
  const ids = new Set(plays.map(p => p.id));
  return {...demoSrc, __demo: true, header: {...demoSrc.header, competitions: [comp]}, plays,
    winprobability: (demoSrc.winprobability || []).filter(w => ids.has(w.playId))};
}
function openDemo(){
  demoSrc = null; gameTab = 'pbp';
  $('#scores').hidden = false; document.body.style.overflow = 'hidden';
  openGame('demo');
}

/* ---------- impact: PIE, nbarapm RAPM, clutch, quarters, skill chart ---------- */
// Percentiles among qualified players, computed once, for the skill chart
let SKILL_POOL = null;
const SKILLS = [
  ['Scoring', s => s.p36], ['Efficiency', s => s.ts], ['Playmaking', s => s.a36],
  ['Rebounding', s => s.r36], ['Defense', s => s.min ? (((s.stl || 0) + (s.blk || 0)) / s.min) * 36 : null], ['Impact', (s, p) => p.pie && p.pie[0]]];
function skillPool(){
  if (SKILL_POOL) return SKILL_POOL;
  const min = M.gpMin || 20, q = Object.values(P).filter(p => p.s && p.s.gp >= min && (p.s.min || 0) >= 10);
  SKILL_POOL = SKILLS.map(([, f]) => q.map(p => f(p.s, p)).filter(v => v != null).sort((a, b) => a - b));
  return SKILL_POOL;
}
function skillPct(p){
  if (!p || !p.s) return null;
  const pool = skillPool();
  return SKILLS.map(([, f], i) => { const v = f(p.s, p); if (v == null) return 0;
    const arr = pool[i]; let lo = 0, hi = arr.length; while (lo < hi){ const m = (lo + hi) >> 1; arr[m] < v ? lo = m + 1 : hi = m; } return Math.round(lo / Math.max(1, arr.length - 1) * 100); });
}
function radarSvg(sets){
  const R = 92, cx = 130, cy = 118, n = SKILLS.length;
  const pt = (i, r) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + Math.cos(a) * r, cy + Math.sin(a) * r]; };
  let g = '';
  for (const lv of [25, 50, 75, 100]) g += `<polygon points="${SKILLS.map((_, i) => pt(i, R * lv / 100).join(',')).join(' ')}" fill="none" stroke="var(--rule)" stroke-width="1"/>`;
  SKILLS.forEach((sk, i) => { const [x, y] = pt(i, R), [lx, ly] = pt(i, R + 16);
    g += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--rule)"/><text x="${lx}" y="${ly + 4}" text-anchor="middle" font-size="10.5" font-family="Barlow Condensed" letter-spacing=".5" fill="var(--mute)">${sk[0].toUpperCase()}</text>`; });
  sets.forEach(([vals, color]) => {
    g += `<polygon points="${vals.map((v, i) => pt(i, R * Math.max(4, v) / 100).join(',')).join(' ')}" fill="${color}" fill-opacity=".22" stroke="${color}" stroke-width="2"/>`;
    vals.forEach((v, i) => { const [x, y] = pt(i, R * Math.max(4, v) / 100); g += `<circle cx="${x}" cy="${y}" r="3" fill="${color}"><title>${SKILLS[i][0]}: ${v}th percentile</title></circle>`; });
  });
  return `<svg viewBox="0 0 260 240" class="radar" role="img" aria-label="Skill chart">${g}</svg>`;
}
function skillSection(p){
  const v = skillPct(p); if (!v) return '';
  return `<section class="sect k-rating"><h3>Skills<span>${esc(M.stats)}, league percentile</span></h3>${radarSvg([[v, 'var(--team-accent)']])}
