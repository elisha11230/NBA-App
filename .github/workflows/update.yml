name: update

# Refreshes rosters, lineups, stats, shots, 2K ratings, contracts, coaches, schedule, history and draft picks twice a day.
on:
  schedule:
    - cron: "15 11 * * *"   # 7:15 AM New York
    - cron: "15 21 * * *"   # 5:15 PM New York
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas pyarrow beautifulsoup4
      - run: python build.py
      - name: Commit if anything changed
        run: |
          git config user.name "nba-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          for f in nba2k.json nba2k_history.json nba2k_players.json salaries.json coaches.json draft_picks.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet || (git commit -m "Update NBA data" && git push)
